name: CI

on:
  push:
    branches: [main, Dev, QA]
  pull_request:
    branches: [main, Dev, QA]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-repair:
    name: Reparación real con Jest y pytest en Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Construir imagen de pruebas sin secretos
        run: |
          docker build -f sandbox/Dockerfile -t devguardian-tests:ci .
          image_id="$(docker image inspect --format '{{.Id}}' devguardian-tests:ci)"
          test -n "$image_id"
          echo "DEVGUARDIAN_SANDBOX_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Verificar aislamiento, timeout y reparación con commit real
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand tests/test-runner/sandbox.test.mjs
  validate:
    name: TypeScript, ESLint, Jest y pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Disposable CI database only; not a production credential.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVGUARDIAN_REQUIRE_PYTEST: '1'
      DEVGUARDIAN_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Instalar dependencias de Node.js
        run: npm ci

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pytest y el adaptador JSON
        id: python
        run: |
          python -m pip install pytest==8.4.2 pytest-json-report==1.5.0
          pytest --version
          python -c "import pytest_jsonreport"

      - name: Configurar identidad Git para los repositorios temporales
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@devguardian.local"

      - name: Verificar TypeScript y ESLint
        id: check
        run: npm run check

      - name: Compilar y ejecutar todas las suites con Jest y pytest reales
        id: tests
        run: npm test

      - name: Resumen de ejecución
        if: ${{ always() }}
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
        shell: bash
        run: |
          {
            echo '## Integración Continua de DevGuardian'
            echo ''
            echo '| Comprobación | Resultado |'
            echo '|---|---|'
            echo "| TypeScript y ESLint (npm run check) | $CHECK_RESULT |"
            echo "| Compilación y suite completa (npm test) | $TEST_RESULT |"
            echo "| Smoke test con Jest real | $TEST_RESULT |"
            echo "| Smoke test con pytest real (obligatorio) | $TEST_RESULT |"
            echo "| Python, pytest y pytest-json-report | $PYTHON_RESULT |"
            echo ''
            echo 'El resultado de los smoke tests corresponde al de la suite completa.'
            echo 'Una suite aprobada exige reportes JSON reales con complete: true y status: passed.'
            echo 'success = aprobado; failure = fallido; skipped = no ejecutado; cancelled = cancelado.'
          } >> "$GITHUB_STEP_SUMMARY"
